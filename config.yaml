scan:
  lookback_days: 300      # calendar days of bars to pull; 200 SMA needs ~290 trading days
  atr_period: 14
  k: 0.5                  # flag when |close - MA| <= k * ATR
  rearm_margin: 1.5       # must exit past k * this before it can be "New" again
  mas:
    - {name: ema21,  kind: ema, period: 21}
    - {name: ema50,  kind: ema, period: 50}
    - {name: sma200, kind: sma, period: 200}

scoring:                  # relative weights; sorts within each section
  distance: 1.0           # closer to the MA scores higher
  slope: 0.5              # MA rising
  stacking: 0.5           # 21 > 50 > 200 intact
  volume: 0.3             # today's volume vs 20d average

llm:
  model: claude-opus-5
  max_tokens: 16000
  effort: high            # low | medium | high | xhigh | max

gex:
  # Sources are tried in order until one yields a chart.
  #
  # barchart.com is NOT usable: it sits behind CloudFront bot protection and
  # returns 403 to headless browsers. Working around that means impersonating a
  # real browser to defeat their blocking, which we don't do. Left here so the
  # next person doesn't retry it.
  #   - url: "https://www.barchart.com/stocks/quotes/{symbol}/gamma-exposure"
  sources:
    - url: "https://optioncharts.io/options/{symbol}/gamma-exposure"
      selector: ".highcharts-container"
      # The page renders several Highcharts; pick the one whose SVG contains
      # this text. Wrapper ids are randomly generated per load, so neither an
      # id nor a fixed index is stable.
      contains: "Gamma Exposure"
      settle_ms: 7000        # charts render after load; wait for the paint
  timeout_ms: 45000
